; Ajustes de producción que se suman al php.ini-production oficial.

; No anunciar la versión de PHP en la cabecera X-Powered-By
expose_php = Off
memory_limit = 256M

; OPcache: el código no cambia dentro de una imagen inmutable, así que no hace
; falta revisar la fecha de los archivos en cada petición.
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0

; Ajustes del pool "www" de PHP-FPM (se carga después de www.conf y zz-docker.conf)
[www]
; Las variables de entorno del contenedor llegan a los workers de PHP
clear_env = no

; Endpoint FastCGI que usa el HEALTHCHECK del contenedor
ping.path = /ping
ping.response = pong

; Tamaño del pool para un contenedor pequeño
pm = dynamic
pm.max_children = 10
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 4
pm.max_requests = 500

; Los healthchecks no ensucian el log de acceso
access.suppress_path[] = /ping

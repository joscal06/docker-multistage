# Nginx como proxy inverso de la API Laravel: sirve los archivos estáticos de
# public/ y envía todo lo demás a PHP-FPM (servicio "api", puerto 9000).
server {
    listen 80 default_server;
    server_name _;
    root /var/www/html/public;
    index index.php;
    charset utf-8;

    server_tokens off;
    client_max_body_size 10m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types application/json application/javascript text/css text/plain;

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # Si el archivo existe en public/ se sirve; si no, lo resuelve Laravel
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Solo el front controller se ejecuta en PHP-FPM
    location ~ ^/index\.php(/|$) {
        fastcgi_pass api:9000;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $document_root;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 60s;
    }

    # Cualquier otro .php y los archivos ocultos (.env, .git…) no se exponen
    location ~ \.php$ { return 404; }
    location ~ /\.(?!well-known).* { deny all; }
}
